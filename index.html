<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobScout — Find work worth applying to</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5EF;--surface:#FFFFFF;--surface-alt:#EEECE5;
  --ink:#171717;--ink-2:#686868;--border:#D9D6CE;
  --lime:#C7F36B;--blue:#3559FF;--coral:#FF705C;
  --success:#278A55;--warning:#C88700;--error:#D94B4B;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:999px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px;line-height:24px}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{text-decoration:none;color:inherit}
input,select{font-family:inherit}
.nav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 32px;height:60px;display:flex;align-items:center;gap:var(--sp-6)}
.nav-brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.5px;flex-shrink:0;color:var(--ink)}
.nav-links{display:flex;gap:4px;flex:1}
.nav-link{padding:6px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-2);background:none;border:none;transition:all .15s ease;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav-link:hover{color:var(--ink);background:var(--bg)}
.nav-link.active{color:var(--ink);background:var(--bg);font-weight:600}
.nav-count{display:inline-flex;align-items:center;justify-content:center;background:var(--lime);color:var(--ink);min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);font-size:11px;font-weight:700}
.nav-pref{margin-left:auto;padding:6px 14px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all .15s}
.nav-pref:hover{color:var(--ink);background:var(--bg)}
.main{max-width:1280px;margin:0 auto;padding:0 32px 80px}
.hero{padding:72px 0 48px;max-width:700px}
.hero-display{font-family:'Fraunces',serif;font-size:56px;line-height:1.1;font-weight:600;letter-spacing:-2px;margin-bottom:18px;color:var(--ink)}
.hero-sub{font-size:16px;line-height:26px;color:var(--ink-2);max-width:460px}
.search-module{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-xl);padding:8px;display:flex;align-items:stretch;gap:0;margin-bottom:14px;box-shadow:0 4px 32px rgba(0,0,0,.07);transition:box-shadow .2s}
.search-module:focus-within{box-shadow:0 8px 48px rgba(0,0,0,.12)}
.sf{flex:1;padding:10px 18px;position:relative;cursor:pointer;transition:background .1s;border-radius:var(--r-md)}
.sf:hover{background:var(--bg)}
.sf-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:3px}
.sf-value{font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px}
.sf-value.ph{color:#aaa}
.sdiv{width:1px;background:var(--border);margin:10px 0;flex-shrink:0}
.search-btn{background:var(--lime);color:var(--ink);border:none;border-radius:var(--r-lg);height:56px;padding:0 32px;font-size:15px;font-weight:700;white-space:nowrap;flex-shrink:0;transition:all .2s;letter-spacing:-.2px;cursor:pointer}
.search-btn:hover{filter:brightness(.92);transform:translateY(-1px);box-shadow:0 4px 16px rgba(199,243,107,.4)}
.search-btn:active{transform:translateY(0)}
.search-btn.loading{opacity:.7;cursor:default;transform:none}
.dd{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px;min-width:230px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.12);display:none}
.dd.open{display:block}
.dd-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:14px;color:var(--ink);transition:background .1s}
.dd-item:hover{background:var(--bg)}
.dd-item.sel{font-weight:600}
.dd-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .1s}
.dd-item.sel .dd-check{background:var(--ink);border-color:var(--ink);color:#fff}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.qchip{height:34px;padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--border);font-size:13px;font-weight:500;background:var(--surface);color:var(--ink-2);transition:all .15s;cursor:pointer}
.qchip:hover:not(.on){border-color:var(--ink-2);color:var(--ink)}
.qchip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.feat-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.feat-label::after{content:'';flex:1;height:1px;background:var(--border)}
.results-header{display:flex;align-items:baseline;gap:12px;margin:32px 0 20px;flex-wrap:wrap}
.results-title{font-size:22px;font-weight:600;line-height:28px}
.results-count{font-size:22px;color:var(--ink-2)}
.results-sort{margin-left:auto;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;outline:none;cursor:pointer}
.results-layout{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.fp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:sticky;top:76px}
.fp-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin-bottom:16px}
.fp-sec{margin-bottom:20px}
.fp-sec-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.fp-chips{display:flex;flex-wrap:wrap;gap:5px}
.fchip{height:28px;padding:0 10px;border-radius:var(--r-pill);border:1.5px solid var(--border);font-size:12px;font-weight:600;background:transparent;color:var(--ink-2);transition:all .12s;cursor:pointer}
.fchip:hover:not(.on){border-color:var(--ink-2)}
.fchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.fp-input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;color:var(--ink);background:var(--bg);outline:none;margin-top:4px;transition:border-color .15s}
.fp-input:focus{border-color:var(--blue)}
.jobs-list{display:flex;flex-direction:column;gap:12px}
.job-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;transition:border-color .15s ease,transform .15s ease;animation:fadeUp .2s ease both}
.job-card:hover{border-color:var(--ink);transform:translateY(-2px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.company-avatar{width:42px;height:42px;border-radius:var(--r-sm);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;letter-spacing:-.5px}
.card-header-info{flex:1;min-width:0}
.card-company{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.heart-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:var(--ink-2);cursor:pointer}
.heart-btn:hover{border-color:var(--coral);color:var(--coral);background:#fff5f4}
.heart-btn.saved{border-color:var(--coral);color:var(--coral);background:#fff5f4}
.card-title{font-size:19px;font-weight:600;line-height:26px;margin-bottom:6px;color:var(--ink)}
.card-meta{font-size:14px;color:var(--ink-2);margin-bottom:12px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center}
.t-remote{border:1px solid #a8e05a;color:#3d6b0c;background:#f0fad8}
.t-english{border:1px solid #a5b4fc;color:var(--blue);background:#eef1ff}
.t-location{border:1px solid var(--border);color:var(--ink-2);background:transparent}
.t-seniority{border:1px solid var(--border);color:var(--ink-2);background:transparent}
.t-closing{border:1px solid var(--coral);color:var(--coral);background:#fff5f3}
.match-row{margin-bottom:12px}
.match-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);margin-bottom:4px}
.m-strong{background:#dff5c2;color:#278A55}
.m-worth{background:#fef3c7;color:#92600a}
.m-possible{background:var(--bg);color:var(--ink-2);border:1px solid var(--border)}
.match-reason{font-size:13px;color:var(--ink-2);line-height:20px}
.visa-sig{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px;line-height:19px}
.vs-ok{background:#f0faf5;color:var(--success)}
.vs-warn{background:#fffbeb;color:#92600a}
.vs-no{background:#fff5f5;color:var(--error)}
.vs-unk{background:var(--bg);color:var(--ink-2)}
.vs-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.vs-text strong{display:block;font-weight:600;margin-bottom:1px}
.vs-text small{font-size:12px;opacity:.75}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap}
.card-meta-right{font-size:13px;color:var(--ink-2)}
.card-source{font-size:12px;color:#ccc;margin-left:6px}
.card-actions{display:flex;gap:8px}
.btn-apply{background:var(--lime);color:var(--ink);border:none;border-radius:var(--r-sm);height:36px;padding:0 18px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-decoration:none;display:inline-flex;align-items:center}
.btn-apply:hover{filter:brightness(.9)}
.btn-track{background:var(--surface);color:var(--blue);border:1.5px solid rgba(53,89,255,.3);border-radius:var(--r-sm);height:36px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-track:hover{background:#eef1ff;border-color:var(--blue)}
.btn-track.tracked{color:var(--success);border-color:rgba(39,138,85,.3);background:#f0faf5}
.skel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:12px}
.sk{background:linear-gradient(90deg,var(--bg) 25%,var(--surface-alt) 50%,var(--bg) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{text-align:center;padding:80px 24px}
.empty-icon{font-size:44px;margin-bottom:18px}
.empty-h{font-size:20px;font-weight:600;margin-bottom:8px}
.empty-p{font-size:14px;color:var(--ink-2);margin-bottom:22px;line-height:21px}
.btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--border);border-radius:var(--r-sm);height:42px;padding:0 22px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-outline:hover{border-color:var(--ink)}
.view-hd{padding:44px 0 24px}
.view-title{font-family:'Fraunces',serif;font-size:36px;font-weight:600;letter-spacing:-1px;margin-bottom:4px}
.view-sub{font-size:15px;color:var(--ink-2)}
.tracker-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.ts{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;text-align:center}
.ts-num{font-size:36px;font-weight:700;margin-bottom:3px;font-family:'Fraunces',serif}
.ts-label{font-size:12px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ts-saved .ts-num{color:var(--ink)}
.ts-applied .ts-num{color:var(--blue)}
.ts-interview .ts-num{color:#7c3aed}
.ts-offer .ts-num{color:var(--success)}
.tracker-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.tb-col{background:var(--surface-alt);border-radius:var(--r-lg);padding:14px;min-height:120px}
.tb-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.tb-t-saved{color:var(--ink)}
.tb-t-applied{color:var(--blue)}
.tb-t-interview{color:#7c3aed}
.tb-t-offer{color:var(--success)}
.tb-count{color:var(--ink-2);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;margin-bottom:8px}
.tc-title{font-size:13px;font-weight:600;line-height:18px;margin-bottom:3px}
.tc-co{font-size:12px;color:var(--ink-2);margin-bottom:10px}
.tc-acts{display:flex;gap:6px;flex-wrap:wrap}
.tc-btn{height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--ink-2);cursor:pointer;transition:all .12s}
.tc-btn:hover{border-color:var(--ink);background:var(--bg)}
.tc-btn.next{border-color:rgba(53,89,255,.4);color:var(--blue)}
.tc-btn.next:hover{background:#eef1ff;border-color:var(--blue)}
.tc-btn.rm{border-color:rgba(217,75,75,.3);color:var(--error)}
.tc-btn.rm:hover{background:#fff5f5}
.tb-empty{font-size:13px;color:var(--ink-2);padding:6px 0}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:var(--r-pill);font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.page-footer{font-size:12px;color:#ccc;text-align:center;padding:32px 0 0;border-top:1px solid var(--border);margin-top:56px;line-height:2}
.page-footer a{color:var(--ink-2)}
</style>
</head>
<body>
<div id="toast"></div>
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">JobScout</div>
    <div class="nav-links">
      <button class="nav-link active" id="nl-jobs" onclick="navTo('search')">Jobs</button>
      <button class="nav-link" id="nl-saved" onclick="navTo('saved')">Saved <span class="nav-count" id="saved-count">0</span></button>
      <button class="nav-link" id="nl-apps" onclick="navTo('apps')">Applications</button>
    </div>
    <button class="nav-pref">Preferences</button>
  </div>
</nav>
<div class="main">
  <div id="root"></div>
  <div class="page-footer">
    Jobs from <a href="https://www.adzuna.com" target="_blank">Adzuna</a> · <a href="https://remotive.com" target="_blank">Remotive</a> · <a href="https://arbeitnow.com" target="_blank">Arbeitnow</a> · <a href="https://himalayas.app" target="_blank">Himalayas</a> &nbsp;·&nbsp;
    UK visa data: <a href="https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers" target="_blank">Home Office Sponsor Register</a><br>
    Visa status is informational only — always confirm sponsorship directly with the employer.
  </div>
</div>
<script>
const AID='586c69ed',AKY='f5d7d2038dc1f8aabff0ebc1d4d8f7f5';
const ROLES=['Product Designer','Product Manager','UX Designer','Fashion Designer','UI Designer'];
const LOCS=['Berlin','Remote Germany','Remote Europe','Remote India','Worldwide'];
const LEVELS=['Any','Junior','Mid-level','Senior','Lead'];
const AV_COLORS=['#3559FF','#FF705C','#278A55','#C88700','#7c3aed','#0ea5e9','#db2777','#ea580c'];
const S={
  view:'search',jobs:[],loading:false,
  selRoles:['Product Designer','Product Manager'],
  selLocs:['Berlin'],selLevel:'Any',kw:'',
  englishOnly:true,excludeGerman:true,
  saved:lsGet('js_saved',[]),apps:lsGet('js_apps',[]),
  lastQ:null,
};
let UKM=null;
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function isSaved(id){return S.saved.some(j=>j._id===id);}
function isTracked(id){return S.apps.some(a=>a.job._id===id);}
function navTo(view){
  S.view=view;
  const map={search:'jobs',results:'jobs',saved:'saved',apps:'apps'};
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.remove('active'));
  const nl=document.getElementById('nl-'+(map[view]||'jobs'));
  if(nl)nl.classList.add('active');
  updateSavedCount();
  render();
  window.scrollTo(0,0);
}
function updateSavedCount(){
  const el=document.getElementById('saved-count');
  if(el)el.textContent=S.saved.length;
}
function render(){
  const root=document.getElementById('root');
  if(!root)return;
  if(S.view==='search')root.innerHTML=renderSearch();
  else if(S.view==='results')root.innerHTML=renderResults();
  else if(S.view==='saved')root.innerHTML=renderSaved();
  else if(S.view==='apps')root.innerHTML=renderApps();
}
function renderSearch(){
  const rv=S.selRoles.length===0?'<span class="ph">Any role</span>':S.selRoles.length===1?esc(S.selRoles[0]):S.selRoles.length+' roles';
  const lv=S.selLocs.length===0?'<span class="ph">Anywhere</span>':S.selLocs.length===1?esc(S.selLocs[0]):S.selLocs.length+' locations';
  const lev=esc(S.selLevel||'Any');
  return '<div class="hero">'
    +'<div class="hero-display">Find work worth<br>applying to.</div>'
    +'<p class="hero-sub">Product, UX, PM and fashion roles filtered for your location, language and work eligibility.</p>'
    +'</div>'
    +'<div class="search-module" id="sm">'
      +'<div class="sf" onclick="openDD(event,\'roles\')">'
        +'<div class="sf-label">What role?</div><div class="sf-value" id="sv-roles">'+rv+'</div>'
        +'<div class="dd" id="dd-roles">'+ROLES.map(r=>'<div class="dd-item'+(S.selRoles.includes(r)?' sel':'')+'" onclick="toggleRole(event,\''+r+'\')"><div class="dd-check">'+(S.selRoles.includes(r)?'✓':'')+'</div>'+esc(r)+'</div>').join('')+'</div>'
      +'</div>'
      +'<div class="sdiv"></div>'
      +'<div class="sf" onclick="openDD(event,\'locs\')">'
        +'<div class="sf-label">Where?</div><div class="sf-value" id="sv-locs">'+lv+'</div>'
        +'<div class="dd" id="dd-locs">'+LOCS.map(l=>'<div class="dd-item'+(S.selLocs.includes(l)?' sel':'')+'" onclick="toggleLoc(event,\''+l+'\')"><div class="dd-check">'+(S.selLocs.includes(l)?'✓':'')+'</div>'+esc(l)+'</div>').join('')+'</div>'
      +'</div>'
      +'<div class="sdiv"></div>'
      +'<div class="sf" onclick="openDD(event,\'level\')">'
        +'<div class="sf-label">Level?</div><div class="sf-value" id="sv-level">'+lev+'</div>'
        +'<div class="dd" id="dd-level">'+LEVELS.map(l=>'<div class="dd-item'+(S.selLevel===l?' sel':'')+'" onclick="setLevel(event,\''+l+'\')"><div class="dd-check">'+(S.selLevel===l?'✓':'')+'</div>'+esc(l)+'</div>').join('')+'</div>'
      +'</div>'
      +'<button class="search-btn" id="search-btn" onclick="doSearch()">Search jobs →</button>'
    +'</div>'
    +'<div class="qchips">'
      +'<button class="qchip'+(S.englishOnly?' on':'')+'" onclick="S.englishOnly=!S.englishOnly;this.classList.toggle(\'on\')">English only</button>'
      +'<button class="qchip'+(S.excludeGerman?' on':'')+'" onclick="S.excludeGerman=!S.excludeGerman;this.classList.toggle(\'on\')">Exclude German-required</button>'
    +'</div>'
    +(HS.length?'<div style="margin-top:52px"><div class="feat-label">⭐ Highsnobiety — Live Berlin openings</div><div class="jobs-list">'+HS.map(j=>card(j)).join('')+'</div></div>':'');
}
function renderResults(){
  const q=S.lastQ;
  const title=(q&&q.roles.length?q.roles[0]:'Jobs')+(q&&q.locs.length?' · '+q.locs[0]:'');
  if(S.loading){
    return '<div class="results-header"><div class="results-title" style="color:var(--ink-2)">Searching...</div></div>'
      +'<div class="results-layout">'+filterPanel()
      +'<div class="jobs-list">'+[1,2,3,4,5].map(()=>skeleton()).join('')+'</div></div>';
  }
  const jobs=S.jobs;
  return '<div class="results-header">'
    +'<div class="results-title">'+esc(title)+'</div>'

function matchScore(j){
  const tl=(j._title||'').toLowerCase(),ll=(j._loc||'').toLowerCase();
  const rm=S.selRoles.some(r=>tl.includes(r.toLowerCase().split(' ')[0]));
  const lm=S.selLocs.some(l=>{
    const lc=l.toLowerCase();
    if(lc==='berlin')return ll.includes('berlin');
    if(lc==='remote germany')return ll.includes('german')||ll.includes('remote')||ll.includes('worldwide');
    if(lc==='remote europe')return ll.includes('europe')||ll.includes('remote')||ll.includes('uk')||ll.includes('worldwide');
    if(lc==='remote india')return ll.includes('india')||ll.includes('worldwide')||ll.includes('remote');
    return ll.includes('remote')||ll.includes('worldwide');
  });
  if(rm&&lm)return{cls:'m-strong',icon:'●',label:'Strong match',reason:'Role and location align with your search.'};
  if(rm)return{cls:'m-worth',icon:'◐',label:'Worth a look',reason:'Role matches — verify the location works for you.'};
  if(lm)return{cls:'m-worth',icon:'◐',label:'Worth a look',reason:'Location matches — check if the role aligns with your skills.'};
  return{cls:'m-possible',icon:'○',label:'Possible match',reason:'Check the full listing to see if it fits.'};
}
function visaSignal(j){
  const t=(j._title||'')+' '+(j._desc||'');
  const VY=['visa sponsorship','will sponsor','sponsorship provided','sponsorship available','we sponsor','skilled worker visa','work permit sponsor','offer sponsorship','happy to sponsor'];
  const VN=['no sponsorship','cannot sponsor','unable to sponsor','must have right to work','we do not offer sponsorship','no visa sponsorship'];
  const l=t.toLowerCase();
  if(VN.some(k=>l.includes(k)))return vs('no','⚠️','Sponsorship not available','Employer states they cannot sponsor for this role');
  if(VY.some(k=>l.includes(k)))return vs('ok','✓','Work eligibility compatible','Employer states visa sponsorship is available');
  if(j._cty==='gb'&&UKM&&UKM!=='err'){
    const f=chkUK(j._company||'');
    if(f&&typeof f==='object')return vs('ok','🇬🇧','UK licensed sponsor',''+esc(f.name)+' appears on the Home Office register — confirm this specific role qualifies');
    if(f===null)return vs('no','🇬🇧','Not on UK sponsor register','Verify directly with employer before applying');
  }
  if(j._cty==='de')return vs('warn','🇩🇪','Sponsorship unclear','EU Blue Card may apply for design/PM roles above €43.8k — ask employer');
  if(j._cty==='in')return vs('ok','🇮🇳','No sponsorship needed','Remote India — you work from your location');
  return vs('unk','⬜','Sponsorship not mentioned','Contact employer directly to confirm eligibility');
}

async function fetchAdzuna(role,locs){

  if(locs.includes('Worldwide'))cfgs.push({c:'gb',wh:''});
  const res=[];const ctyM={de:'de',gb:'gb',nl:'nl',in:'in'};
  for(const cfg of cfgs){
    try{
      const p=new URLSearchParams({app_id:AID,app_key:AKY,results_per_page:8,what:role});
      if(cfg.wh)p.set('where',cfg.wh);
      const r=await fetch('https://api.adzuna.com/v1/api/jobs/'+cfg.c+'/search/1?'+p);
      if(!r.ok)continue;const d=await r.json();
      (d.results||[]).forEach(j=>{
        const loc=cfg.wh||(cfg.c==='de'?'Remote Germany':cfg.c==='gb'?'UK / Europe':cfg.c==='nl'?'Netherlands':'Remote India');
        res.push({_id:'az'+(++_azn),_title:j.title,_company:j.company?.display_name||'',_loc:loc,_desc:j.description,_url:j.redirect_url,_date:j.created,_src:'Adzuna',_sal:j.salary_min&&j.salary_max?'€'+Math.round(j.salary_min/1e3)+'k–€'+Math.round(j.salary_max/1e3)+'k':null,_cty:ctyM[cfg.c]});
      });
    }catch(e){console.warn('Adzuna',e);}
  }
  return res;
}

async function loadUK(){
  const URLS=[
    'https://assets.publishing.service.gov.uk/media/6a3e482e30b491f55b3c4ac3/SP_-_Worker_and_Temporary_Worker_Web_Register_-_2026-06-26.csv',
    'https://corsproxy.io/?url=https://assets.publishing.service.gov.uk/media/6a3e482e30b491f55b3c4ac3/SP_-_Worker_and_Temporary_Worker_Web_Register_-_2026-06-26.csv'
  ];
  for(const url of URLS){
    try{
      const r=await fetch(url);if(!r.ok)continue;
      const txt=await r.text();const lines=txt.split('\n');const map=new Map();
      for(let i=1;i<lines.length;i++){
        const ln=lines[i].trim();if(!ln)continue;
        const c=csvL(ln);if(c.length<4)continue;
        const nm=c[0].replace(/^"+|"+$/g,'').trim();
        const rat=c[3]?c[3].replace(/^"+|"+$/g,'').trim():'';
        const rt=c[4]?c[4].replace(/^"+|"+$/g,'').trim():'';
        if(!nm)continue;const k=normN(nm);
        if(!map.has(k))map.set(k,{name:nm,rating:rat,routes:[]});
        if(rt&&!map.get(k).routes.includes(rt))map.get(k).routes.push(rt);
      }
      UKM=map;return;
    }catch(e){console.warn('UK reg',e);}
  }
  UKM='err';
}
